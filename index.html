<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; form-action 'none'">
<title>NCTS — معمل نتورك — الموديول 2</title>
<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#14212e;--muted:#506172;--line:#cfd8e2;--navy:#0f2f57;--navy2:#1b4478;--teal:#0f8b8d;--teal2:#e1f3f3;--ok:#1b6e34;--okbg:#e5f4e9;--bad:#a3261d;--badbg:#fbe9e7;--warnbg:#fff4d6;
--mono:Consolas,"Cascadia Mono","DejaVu Sans Mono","Liberation Mono",monospace;--sans:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7}
body.big{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f0a500;outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.9em;background:#e9eff5;padding:1px 6px;border-radius:4px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.en{direction:ltr;unicode-bidi:isolate}
pre{font-family:var(--mono);background:#0e1b2a;color:#e6f0f7;padding:12px 14px;border-radius:8px;overflow:auto;direction:ltr;text-align:left;font-size:.85em;line-height:1.45}
header.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:8px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top .brand{font-weight:800;font-size:1.05em;display:flex;align-items:center;gap:8px}
header.top .who{font-size:.9em;background:#ffffff1f;border-radius:20px;padding:2px 12px}
header.top .grow{flex:1}
header.top .tb{background:#ffffff1a;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.85em}
nav.tabs{position:sticky;top:50px;z-index:25;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:6px 14px;flex-wrap:wrap}
nav.tabs a{text-decoration:none;color:var(--ink);padding:6px 14px;border-radius:8px;font-size:.92em;font-weight:600}
nav.tabs a:hover{background:var(--teal2)}
nav.tabs a.on{background:var(--navy);color:#fff}
main{max-width:1180px;margin:0 auto;padding:18px 22px 70px}
h1{font-size:1.6em;color:var(--navy);margin:.2em 0 .4em;line-height:1.3}
h2{font-size:1.3em;color:var(--navy);margin:1.2em 0 .5em}
h3{font-size:1.12em;color:var(--navy);margin:.2em 0 .4em}
h4{font-size:1em;color:var(--teal);margin:.9em 0 .3em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:14px 0;box-shadow:0 1px 2px #0000000d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
table.tbl{border-collapse:collapse;width:100%;margin:8px 0;font-size:.93em;background:#fff}
table.tbl th,table.tbl td{border:1px solid #d6dee7;padding:6px 9px;text-align:right;vertical-align:top}
table.tbl th{background:#eef3f8;color:var(--navy)}
table.tbl td.c,table.tbl th.c{text-align:center}
.diag{margin:12px 0;text-align:center;overflow:auto}
.diag svg{max-width:100%;height:auto}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.btn{border:1px solid #9fb0c2;background:#fff;border-radius:8px;padding:7px 15px;cursor:pointer;font-size:.92em;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{background:#f0f5fa}.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sm{padding:4px 10px;font-size:.85em}.btn[disabled]{opacity:.55;cursor:not-allowed}
.pill{display:inline-block;font-size:.8em;font-weight:700;border-radius:20px;padding:2px 10px;background:#eef2f6;color:var(--navy);margin-inline-end:6px}
.k-sim{background:#e3eefc;color:#1b4478}.k-ws{background:#e7e6ff;color:#3b2c9c}.k-cmd{background:#1e2a36;color:#d7f7d7}.k-lab{background:var(--teal2);color:#0b6466}
.done-badge{color:var(--ok);font-weight:800}
ol.tasks{padding-inline-start:26px}
ol.tasks>li{margin:12px 0;padding:10px 14px;border:1px solid #e1e8ef;border-radius:10px;background:#fbfcfd}
.opts{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.opts label{display:flex;gap:9px;align-items:flex-start;padding:7px 11px;border:1px solid #dfe6ee;border-radius:8px;background:#fff;cursor:pointer}
.opts label:hover{border-color:var(--teal)}.opts input{margin-top:7px}
.opt-why{font-size:.86em;color:var(--muted)}
input.inp,select.inp,textarea.inp{border:1px solid #9fb0c2;border-radius:7px;padding:6px 10px;background:#fff;min-width:0}
input.ltr,.ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
textarea.inp{width:100%;min-height:70px}
.fields{display:grid;grid-template-columns:minmax(170px,max-content) minmax(170px,1fr);gap:7px 12px;align-items:center;margin:6px 0}
.fields .f-ok::after{content:" ✔";color:var(--ok);font-weight:800}
.fields .f-bad::after{content:" ✘";color:var(--bad);font-weight:800}
.match-row{display:grid;grid-template-columns:1fr minmax(180px,1fr);gap:8px;align-items:center;margin:5px 0;padding:6px 9px;border:1px solid #e1e8ef;border-radius:8px;background:#fff}
.order-list{list-style:none;padding:0;margin:6px 0}
.order-list li{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:4px 0;border:1px solid #cfd8e2;border-radius:8px;background:#fff;cursor:grab}
.order-list li .pos{font-weight:800;color:var(--teal);min-width:1.4em}.order-list li .lbl{flex:1}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:.93em}
.fb.ok{background:var(--okbg);color:var(--ok);border:1px solid #9fd0ad}
.fb.bad{background:var(--badbg);color:var(--bad);border:1px solid #e7b1aa}
.fb.info{background:#eef4fa;color:#1f3a56;border:1px solid #c7d7e8}
.fb .x{color:var(--ink);margin-top:4px}
.hint{background:var(--warnbg);border:1px solid #ebd38e;border-radius:8px;padding:7px 12px;margin:6px 0;font-size:.93em}
.sol{background:#eef7ee;border:1px solid #b9dcc0;border-radius:10px;padding:10px 14px;margin-top:10px}
.small{font-size:.86em;color:var(--muted)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stepper{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfcfe;margin:8px 0}
.stepper .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
/* CMD */
.cmd{background:#0c0c0c;color:#cccccc;font-family:var(--mono);font-size:.86em;border-radius:8px;direction:ltr;text-align:left;border:1px solid #333;overflow:hidden}
.cmd .bar{background:#1f1f1f;color:#ddd;padding:5px 10px;font-family:var(--sans);font-size:.85em;display:flex;justify-content:space-between}
.cmd .out{padding:8px 10px;height:330px;overflow:auto;white-space:pre-wrap;word-break:break-word;line-height:1.35}
.cmd .line{display:flex;padding:0 10px 8px}
.cmd .line span{white-space:pre}
.cmd input{flex:1;background:transparent;border:0;color:#fff;font-family:var(--mono);font-size:1em;outline:none;caret-color:#fff}
/* Wireshark */
.wsp{border:1px solid #9aa6b2;border-radius:8px;overflow:hidden;background:#fff;direction:ltr;text-align:left;font-size:.8em}
.wsp .tb{background:#e8ecf0;padding:5px 8px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #c5ced8}
.wsp .tb input{flex:1;font-family:var(--mono);padding:4px 8px;border:1px solid #8b939e;border-radius:3px}
.wsp .tb input.valid{background:#afffaf}.wsp .tb input.invalid{background:#ffafaf}
.wsp .pl{height:210px;overflow:auto;border-bottom:4px solid #e3e7ec}
.wsp table{border-collapse:collapse;width:100%;font-family:var(--mono)}
.wsp th{background:#eceff3;position:sticky;top:0;text-align:left;padding:3px 6px;font-family:var(--sans);font-weight:600}
.wsp td{padding:1px 6px;white-space:nowrap}
.wsp tr.sel td{background:#2c6cc0!important;color:#fff!important}
.wsp .dt{height:230px;overflow:auto;font-family:var(--mono);border-bottom:4px solid #e3e7ec;padding:3px 0}
.wsp .tn{white-space:nowrap;padding:1px 6px;cursor:default;line-height:17px}
.wsp .tn:hover{background:#eef3fb}.wsp .tn.sel{background:#2c6cc0;color:#fff}
.wsp .tn .tw{display:inline-block;width:14px}
.wsp .tn.ex-warn{background:#ffe48a66}.wsp .tn.ex-note{background:#a0cfff33}
.wsp .by{height:150px;overflow:auto;font-family:var(--mono);white-space:pre;padding:3px 8px;line-height:17px}
.wsp .by .hl{background:#2c6cc0;color:#fff}.wsp .by .o{color:#7b8592}
.wsp .st{background:#eceff3;padding:3px 8px;display:flex;justify-content:space-between;gap:8px;font-family:var(--sans)}
.wsp .st .err{color:var(--bad);font-weight:700}
.score-big{font-size:2.2em;font-weight:800;color:var(--navy)}
.bar{height:10px;background:#e4ebf1;border-radius:6px;overflow:hidden;margin-top:6px}.bar>div{height:100%;background:var(--teal)}
.qcard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 16px;margin:12px 0}
.gate{position:fixed;inset:0;background:#0f2f57ee;z-index:100;display:flex;align-items:center;justify-content:center}
.gate .box{background:#fff;border-radius:14px;padding:26px 28px;width:min(460px,92vw);text-align:center}
.gloss td:first-child{font-weight:700;direction:ltr;text-align:left;white-space:nowrap}
details.iv{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 14px;margin:8px 0}
details.iv summary{cursor:pointer;font-weight:700}
#printArea{display:none}
@media print{body{background:#fff;font-size:12pt}header.top,nav.tabs,main,.gate{display:none!important}#printArea{display:block!important}}
</style>
</head>
